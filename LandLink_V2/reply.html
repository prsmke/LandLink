<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reply to Inquiry | LandLink</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5faf6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: #176b3d;
      color: #fff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .chat-header .info { display: flex; flex-direction: column; }
    .chat-header .info .name { font-weight: 700; font-size: 16px; }
    .chat-header .info .sub { font-size: 12px; opacity: .85; }
    .chat-header .close-btn {
      background: rgba(255,255,255,.15);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .chat-header .close-btn:hover { background: rgba(255,255,255,.3); }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.incoming {
      background: #fff;
      border: 1px solid #e1e8e3;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .msg.outgoing {
      background: #176b3d;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg .meta { font-size: 11px; opacity: .65; margin-top: 4px; }
    .msg.outgoing .meta { opacity: .85; }
    .chat-empty {
      text-align: center;
      color: #94a3a8;
      font-size: 13px;
      margin: auto;
      padding: 20px;
    }
    .chat-composer {
      display: flex;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e1e8e3;
      gap: 10px;
    }
    .chat-composer textarea {
      flex: 1;
      border: 1px solid #d7dfda;
      border-radius: 20px;
      padding: 11px 16px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 100px;
    }
    .chat-composer textarea:focus { border-color: #176b3d; }
    .chat-composer button {
      background: #176b3d;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .chat-composer button:disabled { background: #9bb9a6; cursor: not-allowed; }
    .chat-status {
      text-align: center;
      font-size: 12px;
      color: #64748b;
      padding: 6px;
      background: #f2f6f3;
    }
  </style>
</head>
<body>
  <header class="chat-header">
    <div class="info">
      <span class="name" id="chat-name">Loading…</span>
      <span class="sub" id="chat-sub">Inquiry reply</span>
    </div>
    <button class="close-btn" onclick="window.close()" title="Close">&times;</button>
  </header>

  <div class="chat-messages" id="chat-messages">
    <div class="chat-empty">Loading conversation…</div>
  </div>

  <div class="chat-status" id="chat-status"></div>

  <div class="chat-composer">
    <textarea id="chat-input" placeholder="Type your reply…" rows="1"></textarea>
    <button id="chat-send" title="Send">&rarr;</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/config.js" defer></script>
  <script src="assets/backend.js" defer></script>
  <script src="assets/chat.js" defer></script>
  <script>
    function toggleMobileNav() {
      const nav = document.querySelector("nav");
      if (nav) nav.classList.toggle("open");
    }
  </script>
</body>
</html>
